<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Shorts scene</title>
<style>
  @font-face { font-family: Jua; src: url('fonts/Jua.ttf'); }
  @font-face { font-family: BHS; src: url('fonts/BlackHanSans.ttf'); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  text { font-family: Jua, sans-serif; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script>
<script>
function sceneMirror(t, line) {
  let s = '';
  // tiles
  s += `<rect width="1080" height="1920" fill="#CFEFF0"/>`;
  for (let i = 0; i <= 1080; i += 120) s += `<line x1="${i}" y1="0" x2="${i}" y2="1920" stroke="#B4E0E2" stroke-width="5"/>`;
  for (let j = 0; j <= 1920; j += 120) s += `<line x1="0" y1="${j}" x2="1080" y2="${j}" stroke="#B4E0E2" stroke-width="5"/>`;
  // camera slow push
  const z = lerp(1, 1.1, ease(t / 2.7));
  s += `<g transform="translate(540 1050) scale(${z}) translate(-540 -1050)">`;
  // mirror
  s += `<rect x="110" y="380" width="860" height="1080" rx="60" fill="#8FA7B3"/>`;
  s += `<rect x="135" y="405" width="810" height="1030" rx="45" fill="#EAF7FB"/>`;
  s += `<path d="M180 520 L330 420 M200 640 L430 470" stroke="#fff" stroke-width="22" stroke-linecap="round" opacity=".8"/>`;
  s += `<clipPath id="mc"><rect x="135" y="405" width="810" height="1030" rx="45"/></clipPath>`;
  // her reflection
  const raise = ease(prog(t, 0.45, 0.85));
  const noticed = t > 0.95;
  const sway = noticed ? 0 : Math.sin(t * 4) * 2.5;
  const m = line.mouthAt(t);
  s += `<g clip-path="url(#mc)">`;
  s += mom({ x: 540, y: 1560, s: 1.05, t, tilt: sway, rPose: 'up', rK: raise,
             lPose: 'touch', lK: ease(prog(t, 0.75, 1.0)),
             expr: noticed ? 'shock' : 'neutral', mouth: m, blink: !noticed && (t % 2.2) > 2.05 });
  s += `</g>`;
  // lump marker on her left side (viewer's left: the touching hand)
  if (t > 0.95) {
    const p = pop(t, 0.95), pulse = 1 + 0.12 * Math.sin(t * 14);
    const cx = 540 - 118 * 1.05, cy = 1560 - 340 * 1.05;
    s += `<circle cx="${cx}" cy="${cy}" r="${48 * p * pulse}" fill="none" stroke="#FF3B5C" stroke-width="9" stroke-dasharray="16 10"/>`;
    s += `<g transform="translate(${cx - 120} ${cy - 120}) scale(${p})">`
       + `<rect x="-95" y="-48" width="190" height="76" rx="38" fill="#FF3B5C"/>`
       + outlined(0, 12, '멍울?!', 50, '#fff', '#FF3B5C', 0) + `</g>`;
  }
  // ?! over head
  if (t > 1.0) {
    const p = pop(t, 1.0, 0.3);
    s += `<g transform="translate(790 640) scale(${p}) rotate(12)">${outlined(0, 0, '?!', 170, '#FFD23F', '#1B1B1F', 16, 'BHS')}</g>`;
  }
  s += `</g>`;
  // counter + sink
  s += `<rect x="0" y="1470" width="1080" height="450" fill="#F7F1E8"/>`;
  s += `<rect x="0" y="1460" width="1080" height="30" fill="#E2D6C6"/>`;
  s += `<rect x="760" y="1360" width="90" height="110" rx="14" fill="#9AD0F5"/>`;
  s += `<path d="M785 1365 L770 1250 M815 1365 L835 1240" stroke="#FF8FAB" stroke-width="12" stroke-linecap="round"/>`;
  s += `<path d="M180 1470 Q180 1400 250 1400 L330 1400 Q400 1400 400 1470 Z" fill="#fff" stroke="#D9D0C3" stroke-width="5"/>`;
  return s;
}

function scenePanic(t, line, dur) {
  let s = '';
  // comic burst
  s += `<rect width="1080" height="1920" fill="#FFE27A"/>`;
  const rot = t * 18;
  s += `<g transform="translate(540 900) rotate(${rot})">`;
  for (let i = 0; i < 18; i++) {
    const a = i * 20 * Math.PI / 180, b = (i * 20 + 10) * Math.PI / 180;
    s += `<path d="M0 0 L${2000 * Math.cos(a)} ${2000 * Math.sin(a)} L${2000 * Math.cos(b)} ${2000 * Math.sin(b)} Z" fill="#FFB547"/>`;
  }
  s += `</g>`;
  const jx = Math.sin(t * 55) * 6, jy = Math.cos(t * 47) * 4;
  const m = line.mouthAt(t);
  s += mom({ x: 540 + jx, y: 1880 + jy, s: 1.85, t, expr: 'worry', mouth: m, blink: false, legs: false });
  // sweat + ? marks
  for (let i = 0; i < 3; i++) {
    const k = ((t * 1.6 + i / 3) % 1);
    s += sweat(820 + i * 40, 560 + k * 160, 1.6, 1 - k);
  }
  for (const [qx, qy, d] of [[170, 600, 0.2], [930, 480, 0.4], [200, 380, 0.6]]) {
    const p = pop(t, d);
    s += `<g transform="translate(${qx} ${qy + Math.sin(t * 5 + qx) * 12}) scale(${p})">${outlined(0, 0, '?', 120, '#fff', '#1B1B1F', 14, 'BHS')}</g>`;
  }
  // phone
  const pin = ease(prog(t, 0, 0.25));
  const py = lerp(1950, 1180, pin);
  s += `<g transform="translate(600 ${py}) rotate(-8)">`;
  s += `<rect x="0" y="0" width="400" height="720" rx="50" fill="#22222B"/>`;
  s += `<rect x="18" y="22" width="364" height="676" rx="36" fill="#fff"/>`;
  s += `<rect x="40" y="70" width="320" height="64" rx="32" fill="#F1F3F6" stroke="#4A90D9" stroke-width="4"/>`;
  const q = '임신 겨드랑이 멍울';
  const n = Math.floor(clamp((t - 0.15) / 1.0) * q.length);
  const cursor = (t * 3) % 1 < 0.5 ? '|' : '';
  s += `<text x="62" y="113" font-size="30" fill="#222">${esc(q.slice(0, n) + (n < q.length ? cursor : ''))}</text>`;
  s += `<circle cx="330" cy="102" r="13" fill="none" stroke="#4A90D9" stroke-width="5"/><path d="M339 111 L350 122" stroke="#4A90D9" stroke-width="5" stroke-linecap="round"/>`;
  const results = ['겨드랑이 멍울, 원인은?', '임신 중 멍울 생기면…', '이거 혹시 큰 병?'];
  results.forEach((r, i) => {
    const k = ease(prog(t, 1.25 + i * 0.25, 1.5 + i * 0.25));
    if (k <= 0) return;
    s += `<g opacity="${k}" transform="translate(0 ${(1 - k) * 30})">`;
    s += `<rect x="40" y="${170 + i * 130}" width="320" height="105" rx="18" fill="${i === 2 ? '#FFE3E8' : '#F5F7FA'}"/>`;
    s += `<rect x="58" y="${195 + i * 130}" width="240" height="14" rx="7" fill="#C9D3DE"/>`;
    s += `<text x="58" y="${252 + i * 130}" font-size="30" fill="${i === 2 ? '#E0314F' : '#1E3A8A'}">${esc(r)}</text>`;
    s += `</g>`;
  });
  s += `</g>`;
  return s;
}

function sceneClinic(t, line, dur) {
  let s = '';
  s += `<rect width="1080" height="1920" fill="#DDF3EA"/>`;
  s += `<rect x="0" y="1380" width="1080" height="540" fill="#C6E4D8"/>`;
  // window with blinds
  s += `<rect x="690" y="420" width="300" height="360" rx="16" fill="#BFE6FF" stroke="#fff" stroke-width="14"/>`;
  for (let j = 450; j < 770; j += 40) s += `<line x1="700" y1="${j}" x2="980" y2="${j}" stroke="#fff" stroke-width="6" opacity=".8"/>`;
  // info board
  const bp = pop(t, 0.3, 0.4);
  s += `<g transform="translate(330 640) scale(${bp}) translate(-330 -640)">`;
  s += `<rect x="70" y="400" width="520" height="520" rx="24" fill="#fff" stroke="#8BC6B0" stroke-width="10"/>`;
  s += `<text x="330" y="470" font-size="44" text-anchor="middle" fill="#2E7D63">젖줄(유선)이란?</text>`;
  // simple body outline with the milk line
  s += `<g transform="translate(330 700)">`;
  s += `<circle cx="0" cy="-160" r="45" fill="none" stroke="#9AA9B8" stroke-width="7"/>`;
  s += `<path d="M-90 -100 Q-110 40 -70 190 L70 190 Q110 40 90 -100 Q0 -125 -90 -100 Z" fill="none" stroke="#9AA9B8" stroke-width="7"/>`;
  s += `<path d="M-80 -80 Q-55 60 -18 190 M80 -80 Q55 60 18 190" stroke="#FF8FAB" stroke-width="5" stroke-dasharray="10 9" fill="none"/>`;
  const glow = 1 + 0.2 * Math.sin(t * 9);
  s += `<circle cx="-82" cy="-78" r="${18 * glow}" fill="#FF3B5C" opacity=".85"/>`;
  s += `<circle cx="82" cy="-78" r="${18 * glow}" fill="#FF3B5C" opacity=".85"/>`;
  s += `</g>`;
  s += `<text x="330" y="890" font-size="32" text-anchor="middle" fill="#555">겨드랑이부터 이어지는 선</text>`;
  s += `</g>`;
  // doctor (left) and mom (right)
  const lt = t;
  const m = line.mouthAt(t);
  s += doctor({ x: 290, y: 1620, s: 0.95, t, mouth: m, expr: 'happy', blink: (t % 2.6) > 2.45 && m < 0.05, point: ease(prog(t, 0.2, 0.6)) });
  const relieved = t > line.end - line.sceneStart + 0.1;
  s += mom({ x: 800, y: 1760, s: 0.88, t, expr: relieved ? 'shock' : 'worry', lPose: 'down', rPose: 'down', blink: false });
  // desk
  s += `<rect x="-20" y="1500" width="1120" height="70" rx="12" fill="#B98B62"/>`;
  s += `<rect x="20" y="1560" width="1040" height="360" fill="#A57A55"/>`;
  // info chips
  const chips = ['부유방 = 젖줄 위 여분 조직', '임신하면 커질 수 있어요'];
  chips.forEach((c, i) => {
    const p = pop(t, 1.2 + i * 0.9, 0.35);
    if (p <= 0) return;
    const y = 990 + i * 100;
    const w = 36 * c.length + 50;
    s += `<g transform="translate(${1040 - w / 2} ${y}) scale(${p}) translate(${-w / 2} 0)">`;
    s += `<rect x="0" y="-50" width="${w}" height="82" rx="41" fill="#2E7D63"/>`;
    s += `<text x="${w / 2}" y="5" font-size="40" text-anchor="middle" fill="#fff">${esc(c)}</text>`;
    s += `</g>`;
  });
  // she catches the word "젖줄"
  if (relieved) {
    s += `<g transform="translate(930 1170) scale(${pop(t, line.end - line.sceneStart + 0.1)}) rotate(10)">${outlined(0, 0, '젖…줄?', 76, '#fff', '#1B1B1F', 12)}</g>`;
  }
  return s;
}

function sceneGirl(t, line) {
  let s = '';
  s += `<defs><radialGradient id="dreamy" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#FFF0F7"/><stop offset="1" stop-color="#FFB8D9"/></radialGradient></defs>`;
  s += `<rect width="1080" height="1920" fill="url(#dreamy)"/>`;
  // bokeh
  for (let i = 0; i < 14; i++) {
    const bx = (i * 173) % 1080, by = 420 + ((i * 271) % 1200) - (t * 30 * (1 + i % 3)) % 200;
    s += `<circle cx="${bx}" cy="${by}" r="${30 + (i % 4) * 18}" fill="#fff" opacity=".35"/>`;
  }
  // flowers
  for (let i = 0; i < 7; i++) {
    const fx = 80 + i * 155, fy = 1520 + (i % 2) * 60;
    for (let k = 0; k < 5; k++) s += `<circle cx="${fx + 26 * Math.cos(k * 1.256 + t)}" cy="${fy + 26 * Math.sin(k * 1.256 + t)}" r="20" fill="${i % 2 ? '#FFD1E3' : '#FFF7B0'}"/>`;
    s += `<circle cx="${fx}" cy="${fy}" r="14" fill="#FFB547"/>`;
  }
  const m = line.mouthAt(t);
  s += mom({ x: 540, y: 1660, s: 1.2, t, girl: true, expr: 'sparkle', mouth: m,
             lPose: 'touch', lK: 0.6, rPose: 'touch', rK: 0.6, tilt: Math.sin(t * 2.5) * 4 });
  // dew drop she "lives on"
  const dy = 640 + Math.sin(t * 3) * 18;
  s += `<path transform="translate(800 ${dy}) scale(2.2)" d="M0 -30 C14 -8 20 6 0 20 C-20 6 -14 -8 0 -30 Z" fill="#BFE9FF" stroke="#7CC8FF" stroke-width="3"/>`;
  s += `<text x="800" y="${dy + 105}" font-size="40" text-anchor="middle" fill="#3A8FD0">이슬</text>`;
  for (let i = 0; i < 8; i++) {
    const k = (t * 0.8 + i / 8) % 1;
    s += sparkleStar(200 + (i * 97) % 700, 1300 - k * 700, 1 + (i % 3) * 0.4, Math.sin(k * Math.PI));
  }
  // flashback film look
  s += `<rect width="1080" height="1920" fill="#FFC0DA" opacity=".12"/>`;
  s += `<rect x="16" y="16" width="1048" height="1888" rx="40" fill="none" stroke="#fff" stroke-width="14" opacity=".8"/>`;
  s += `<g transform="translate(70 450)"><rect width="250" height="80" rx="16" fill="#000" opacity=".55"/><text x="125" y="55" font-size="46" text-anchor="middle" fill="#fff">10년 전…</text></g>`;
  return s;
}

function sceneRealize(t, line) {
  let s = '';
  // three dramatic zoom hits: dun · dun · DUN
  const step = t < 0.35 ? 0 : t < 0.7 ? 1 : 2;
  const bg = ['#3B1F5C', '#5C1F3F', '#7A1010'][step];
  s += `<rect width="1080" height="1920" fill="${bg}"/>`;
  s += `<g transform="translate(540 980)">`;
  for (let i = 0; i < 48; i++) {
    const a = i * 7.5 * Math.PI / 180 + t * 0.4;
    const r0 = 380 + (i % 3) * 60;
    s += `<line x1="${r0 * Math.cos(a)}" y1="${r0 * Math.sin(a)}" x2="${1400 * Math.cos(a)}" y2="${1400 * Math.sin(a)}" stroke="#fff" stroke-width="${3 + (i % 4) * 3}" opacity=".35"/>`;
  }
  s += `</g>`;
  const z = [1.5, 1.9, 2.4][step] + 0.03 * Math.sin(t * 40) * (step === 2 && t < 1.0 ? 1 : 0);
  const m = line.mouthAt(t);
  s += mom({ x: 540, y: 980 + 530 * z, s: z, t, expr: 'shock', mouth: m, legs: false });
  // lightning
  if (step === 2 && t < 1.1) {
    s += `<path d="M120 300 L230 520 L170 530 L280 760 L140 560 L200 550 Z M960 360 L850 580 L910 590 L800 820 L940 610 L880 600 Z" fill="#FFE14D" opacity="${(Math.floor(t * 20) % 2) ? 1 : 0.4}"/>`;
  }
  const p = pop(t, line.end - line.sceneStart - 0.6, 0.35);
  if (p > 0) s += `<g transform="translate(540 600) scale(${p}) rotate(-6)">${outlined(0, 0, '나… 포유류?!', 130, '#FFE14D', '#1B1B1F', 18, 'BHS')}</g>`;
  return s;
}

function sceneDocu(t, line, dur, endStart) {
  let s = '';
  s += `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset=".55" stop-color="#FFC56B"/><stop offset="1" stop-color="#FFE7A8"/></linearGradient></defs>`;
  s += `<rect width="1080" height="1920" fill="url(#sky)"/>`;
  s += `<circle cx="540" cy="${980 - t * 8}" r="260" fill="#FFF1C2" opacity=".9"/>`;
  // acacia silhouettes + ground
  s += `<path d="M120 1220 L140 980 M140 980 Q60 960 20 930 Q140 900 300 930 Q240 960 140 980" stroke="#3A2416" stroke-width="18" fill="#3A2416"/>`;
  s += `<path d="M930 1240 L950 1020 M950 1020 Q870 1000 820 975 Q960 940 1080 975 Q1030 1000 950 1020" stroke="#3A2416" stroke-width="16" fill="#3A2416"/>`;
  s += `<path d="M0 1200 Q270 1150 540 1190 Q810 1230 1080 1180 L1080 1920 L0 1920 Z" fill="#B7832F"/>`;
  s += `<path d="M0 1300 Q300 1260 600 1300 Q850 1330 1080 1290 L1080 1920 L0 1920 Z" fill="#9A6A22"/>`;
  // slow documentary push-in
  const z = lerp(1, 1.06, t / dur);
  s += `<g transform="translate(540 1300) scale(${z}) translate(-540 -1300)">`;
  s += cow(235, 1170, 0.95);
  s += dog(890, 1150, 1.0);
  s += cat(880, 1460, 0.85);
  s += mom({ x: 520, y: 1880, s: 0.95, t, expr: 'proud', mouth: 0, rPose: 'hip', rK: 1, lPose: 'down' });
  s += `</g>`;
  const wl = [['음매~ 어서 와', 230, 960, 0.8], ['멍! 환영해', 860, 960, 1.3], ['냥', 900, 1290, 1.8]];
  for (const [txt, bx, by, d] of wl) { const p = pop(t, d); if (p > 0) s += bubble(bx, by, txt, p); }
  // documentary lower-third (taxonomy)
  const lk = ease(prog(t, 0.4, 0.8));
  s += `<g transform="translate(${lerp(-700, 60, lk)} 520)">`;
  s += `<rect width="620" height="190" fill="#000" opacity=".55"/><rect width="620" height="190" fill="none" stroke="#FFD23F" stroke-width="10"/>`;
  s += `<text x="34" y="78" font-size="58" fill="#FFD23F">엄마 (임신 중)</text>`;
  s += `<text x="34" y="148" font-size="40" fill="#fff">포유강 · 영장목 · 사람과</text></g>`;
  // end card
  if (t > endStart) {
    const k = ease(prog(t, endStart, endStart + 0.45));
    s += `<rect width="1080" height="1920" fill="#000" opacity="${0.45 * k}"/>`;
    s += `<g transform="translate(0 ${(1 - k) * 500})" opacity="${k}">`;
    s += `<rect x="80" y="1060" width="920" height="560" rx="50" fill="#fff"/>`;
    s += `<rect x="80" y="1060" width="920" height="110" rx="50" fill="#FF5C8A"/><rect x="80" y="1120" width="920" height="50" fill="#FF5C8A"/>`;
    s += `<text x="540" y="1138" font-size="56" text-anchor="middle" fill="#fff">포유류 엄마 꿀팁</text>`;
    s += `<text x="540" y="1270" font-size="58" text-anchor="middle" fill="#222">부유방, 생각보다 흔해요</text>`;
    s += `<text x="540" y="1360" font-size="58" text-anchor="middle" fill="#222">그래도 새로 생긴 멍울은</text>`;
    s += `<text x="540" y="1450" font-size="62" text-anchor="middle" fill="#E0314F">꼭 진료로 확인하세요!</text>`;
    const bp = pop(t, endStart + 0.6);
    s += `<g transform="translate(540 1545) scale(${bp})">`;
    s += `<rect x="-330" y="-48" width="300" height="88" rx="44" fill="#FF3B3B"/><text x="-180" y="12" font-size="42" text-anchor="middle" fill="#fff">구독</text>`;
    s += `<rect x="30" y="-48" width="300" height="88" rx="44" fill="#222"/><text x="180" y="12" font-size="42" text-anchor="middle" fill="#fff">좋아요 ♥</text>`;
    s += `</g></g>`;
  }
  return s;
}

// ───────────────────────── overlay ─────────────────────────
function title(t) {
  let s = '';
  const p = Math.min(1, pop(t, 0, 0.45));
  s += `<g transform="translate(540 230) scale(${p})">`;
  s += `<rect x="-230" y="-150" width="460" height="80" rx="40" fill="#FF5C8A"/>`;
  s += `<text x="0" y="-92" font-size="50" text-anchor="middle" fill="#fff">소녀였던 내가</text>`;
  s += outlined(0, 40, '알고 보니 포유류?!', 118, '#FFE14D', '#1B1B1F', 18, 'BHS');
  s += `</g>`;
  return s;
}

// Split a line into subtitle chunks at sentence ends, timed by length.
let TL = window.TL;
function render(T) {
  if (!TL._ready) { prepare(); TL._ready = true; }
  const sc = TL.scenes.find(s => T >= s.start && T < s.end) || TL.scenes[TL.scenes.length - 1];
  const t = T - sc.start, dur = sc.end - sc.start;
  let body = '';
  if (sc.name === 'girl') body = sceneGirl(t, sc.line, dur);
  if (sc.name === 'mirror') body = sceneMirror(t, sc.line, dur);
  if (sc.name === 'realize') body = sceneRealize(t, sc.line, dur);
  if (sc.name === 'docu') body = sceneDocu(t, sc.line, dur, dur - 2.6);
  if (sc.name === 'panic') body = scenePanic(t, sc.line, dur);
  if (sc.name === 'clinic') body = sceneClinic(t, sc.line, dur);
  // scene-in zoom + flash
  const zk = ease(prog(t, 0, 0.3));
  const z = sc.name === 'girl' ? 1 : lerp(1.08, 1, zk);
  let out = `<g transform="translate(540 960) scale(${z}) translate(-540 -960)">${body}</g>`;
  if (sc.name !== 'girl' && t < 0.25) out += `<rect width="1080" height="1920" fill="#fff" opacity="${1 - t / 0.25}"/>`;
  out += title(T);
  out += subtitle(T);
  document.getElementById('stage').innerHTML = out;
}
window.render = render;
</script>
</body>
</html>
