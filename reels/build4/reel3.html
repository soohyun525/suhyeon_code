<style>
:root{--ink:#121212;--lime:#b7f400;--pur:#8a1cf6;--bg:#fdfdfb;--red:#f0453a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#222;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:var(--bg);overflow:hidden;font-family:'Jua',sans-serif;color:var(--ink)}
.scene{position:absolute;inset:0;visibility:hidden}
.scene.on{visibility:visible}
.abs{position:absolute}
.bagel{font-family:'Bagel Fat One','Jua',sans-serif;font-weight:400}
.gaegu{font-family:'Gaegu','Jua',sans-serif;font-weight:700;letter-spacing:-3px}
.boil{filter:url(#boil)}
.boil2{filter:url(#boil2)}
svg{overflow:visible}
.ink{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}

/* --- animation primitives (delay = absolute time on the global timeline) --- */
.pop{animation:pop .42s calc(var(--s) + var(--d)) both cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(var(--r0,-6deg))}1%{opacity:1}100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
.slam{animation:slam .3s calc(var(--s) + var(--d)) both cubic-bezier(.2,.9,.3,1.25)}
@keyframes slam{0%{opacity:0;transform:scale(2.6) rotate(var(--r0,4deg))}1%{opacity:1}100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
.up{animation:up .5s calc(var(--s) + var(--d)) both cubic-bezier(.2,1.3,.4,1)}
@keyframes up{0%{opacity:0;transform:translateY(var(--y,140px)) rotate(var(--r,0deg))}1%{opacity:1}100%{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}}
.fade{animation:fade .35s calc(var(--s) + var(--d)) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.draw{stroke-dasharray:1;animation:draw var(--dur,.45s) calc(var(--s) + var(--d)) both cubic-bezier(.5,0,.3,1)}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.wig{animation:wig 1.1s infinite ease-in-out}
@keyframes wig{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.bob{animation:bob .8s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.shiver{animation:shiver .12s infinite linear}
@keyframes shiver{0%{transform:translate(-4px,1px)}50%{transform:translate(4px,-2px)}100%{transform:translate(-4px,1px)}}
.shake{animation:shake .5s calc(var(--s) + var(--d)) both}
@keyframes shake{0%{transform:translate(0,0)}15%{transform:translate(-22px,12px)}30%{transform:translate(20px,-14px)}45%{transform:translate(-14px,-8px)}60%{transform:translate(12px,8px)}80%{transform:translate(-5px,3px)}100%{transform:translate(0,0)}}
.pulse{animation:pulse .7s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.blinkout{animation:blinkout .5s calc(var(--s) + var(--d)) both}
@keyframes blinkout{0%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(.8)}}
.yank{animation:yank .5s calc(var(--s) + var(--d)) both cubic-bezier(.3,1.6,.5,1)}
@keyframes yank{from{transform:translate(0,0) rotate(0)}to{transform:translate(150px,-70px) rotate(18deg)}}
.zoom{animation:zoom 3.2s calc(var(--s) + var(--d)) both linear}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.04)}}

/* --- shared pieces --- */
.brand{left:64px;top:150px;font-size:44px;color:var(--pur);line-height:.9;letter-spacing:-1px}
.brand i{display:block;height:8px;width:112px;background:var(--lime);border-radius:8px;margin-top:8px;transform:rotate(-2deg)}
.ep{right:64px;top:160px;font-size:34px;color:#888}
.time{left:64px;top:290px;display:flex;align-items:center;gap:22px;transform-origin:left center}
.time .t{font-size:118px;line-height:1;letter-spacing:-2px}
.time .ampm{font-size:50px;margin-right:-6px;align-self:flex-end;padding-bottom:14px}
.tag{display:inline-block;background:var(--lime);border:6px solid var(--ink);border-radius:60px;padding:10px 30px 8px;font-size:46px;white-space:nowrap}
.tag.p{background:var(--pur);color:#fff}
.tag.k{background:var(--ink);color:var(--lime)}
.bub{position:absolute;max-width:780px;background:#fff;border:7px solid var(--ink);border-radius:46px;padding:30px 42px 26px;font-size:62px;line-height:1.22;transform-origin:left bottom;box-shadow:10px 12px 0 var(--ink)}
.bub.r{transform-origin:right bottom}
.bub.b{background:var(--lime)}
.bub.c{background:var(--ink);color:#fff;box-shadow:10px 12px 0 var(--pur)}
.bub.c .hl{background:none;color:var(--lime)}
.bub .w{position:absolute;top:-56px;left:8px;font-size:38px;color:#777;white-space:nowrap;font-family:'Jua'}
.bub.r .w{left:auto;right:8px}
.bub.pu{background:var(--pur);color:#fff}
.who{position:absolute;font-size:36px;color:#777}
.note{font-size:60px;color:var(--pur);line-height:1.1}
.hl{background:linear-gradient(transparent 52%,var(--lime) 52%,var(--lime) 94%,transparent 94%)}
</style>

<style>
.bub.t{position:absolute;bottom:690px;max-width:900px;font-size:70px;line-height:1.24;padding:34px 46px 30px;visibility:hidden}
.bub.t.big{font-size:150px;padding:20px 56px 14px}
.bub.t::after{content:'';position:absolute;bottom:-27px;left:var(--tx);width:44px;height:44px;background:inherit;border-right:7px solid var(--ink);border-bottom:7px solid var(--ink);transform:rotate(45deg)}
.bub.t.prev::after{display:none}
.bub.t.a{left:70px;--tx:120px;transform-origin:150px 100%}
.bub.t.b{left:0;right:0;margin:0 auto;width:fit-content;--tx:calc(50% - 22px);transform-origin:50% 100%}
.bub.t.c{right:70px;--tx:calc(100% - 190px);transform-origin:calc(100% - 150px) 100%}
.actor{position:absolute;top:1290px;width:320px;text-align:center;transform-origin:50% 85%}
.actor .nm{display:inline-block;margin-top:6px;font-size:40px;border:6px solid var(--ink);border-radius:40px;padding:4px 22px 2px;background:#fff}
.actor.b .nm{background:var(--lime)} .actor.c .nm{background:var(--ink);color:#fff;border-color:var(--pur)}
.prop{position:absolute;left:70px;top:452px;width:940px;height:400px;visibility:hidden;transform-origin:50% 60%}
.prop .pc{position:absolute;inset:0;background:#fff;border:7px solid var(--ink);border-radius:44px;box-shadow:10px 12px 0 var(--pur)}

:root{--bg:#f5efff}
.feedroll{animation:feedroll 3.6s var(--s) both cubic-bezier(.3,0,.2,1)}
@keyframes feedroll{from{transform:translateY(0)}to{transform:translateY(-1290px)}}
.pics{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:30px}
.pic{position:relative;width:262px;height:350px;border:7px solid var(--ink);border-radius:26px;overflow:hidden;background:#000;flex:none}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic span,.ftile span.h{position:absolute;left:0;right:0;bottom:0;background:rgba(18,18,18,.82);color:#fff;font-size:24px;padding:5px 0 3px;text-align:center;font-family:'Jua'}
.ftile{position:relative;height:430px;border-bottom:10px solid #121212;overflow:hidden;background:#000}
.ftile img{width:100%;height:100%;object-fit:cover;display:block}
.ftile span.h{font-size:30px;padding:8px 0 5px}

<script>
const V=window.VOICE||{dur:{},env:{}};
const H='<span class="hl">',E='</span>';
/* ---------- script ---------- */
const SC=[
 {type:'hook', narr:[{id:'n1',say:'에이아이 시대'},{id:'n2',say:'유쾌하다고'}]},
 {type:'talk', time:'1:52', tag:'오늘의 주제', lines:[
  {w:'c',html:`${H}AI 콘텐츠${E}와<br>AI 인플루언서가<br>범람하는 시대`,say:'AI 콘텐츠와 AI 인플루언서가 범람하는 시대.'},
  {w:'c',html:`첨엔 너무 쉽게들<br>돈 버는 거 아닌가 했는데<br>이젠 ${H}안 하면 바보${E} 되는 것 같음`,say:'처음엔 너무 쉽게들 돈 버는 거 아닌가 했는데, 이젠 안 하면 바보 되는 것 같음.',fs:60},
  {w:'b',html:`약간 불쾌한 지점 지나서<br>${H}유쾌해짐${E}`,say:'제 느낌은, 약간 불쾌한 지점 지나서, 유쾌해짐.',emo:{b:'happy'}}]},
 {type:'talk', time:'1:54', tag:'대놓고 AI', cls:'p', rot:3, lines:[
  {w:'b',html:'요즘 할머니가<br>픽시 자전거 타고<br>가게 가는 거 재밌더라고요',say:'요즘 할머니가 픽시 자전거 타고 가게 가는 거, 재밌더라고요.',fs:64},
  {w:'b',html:`근데 AI인데 ${H}아닌 척${E}하면<br>전 좀 별론 거 같아요`,say:'근데 AI인데 아닌 척하면, 전 좀 별론 거 같아요.',fs:64,emo:{b:'lazy'}},
  {w:'c',html:`사랑꾼인 척했다가<br>아닌 거 알게 되면<br>${H}나락 가듯..${E}`,say:'사랑꾼인 척했다가, 아닌 거 알게 되면 나락 가듯.'},
  {w:'c',html:'대놓고 AI인 게<br>더 낫다!!',say:'대놓고 AI인 게 더 낫다!',emo:{c:'happy',b:'happy'}}]},
 {type:'talk', time:'1:59', tag:'각자의 최애', lines:[
  {w:'c',html:`저는 강아지가 말하고<br>${H}사람 훈육시키는${E} 영상<br>최애입니다..`,say:'저는 강아지가 말하고, 사람 훈육시키는 영상이 최애입니다.'},
  {w:'c',html:'“스톱! 나 밥 먹잖아”<br>이러고 주인 훈육시킴 ㅋㅋ',say:'스톱! 나 밥 먹잖아! 이러고 주인 훈육시킴.',fs:64,emo:{c:'happy',a:'happy'}},
  {w:'a',html:`저는 ${H}AI 병맛 드라마${E}요<br>너무 잘 만드니까<br>재미나더라구요!`,say:'저는 AI 병맛 드라마요. 너무 잘 만드니까 재미나더라고요!',emo:{a:'happy'}}]},
 {type:'talk', time:'2:04', tag:'근데 말이죠', cls:'k', rot:-3, lines:[
  {w:'a',html:`어느 임계점에 도달하면<br>${H}인간을 찾을 수도${E}<br>있겠다 싶긴 합니다..!`,say:'하지만 어느 임계점에 도달하면, 인간을 찾을 수도 있겠다 싶긴 합니다.'},
  {w:'b',html:'이런 걸 보고 자라는<br>10대들은<br>어떻게 받아들일지..',say:'이런 걸 보고 자라는 십대들은, 어떻게 받아들일지.'},
  {w:'a',html:`제 조카가 8살인데<br>AI 콘텐츠 / 인간 콘텐츠<br>${H}구분하지 않더라고요${E}`,say:'제 조카가 여덟 살인데, AI 콘텐츠랑 인간 콘텐츠를 구분하지 않더라고요.',fs:64,emo:{b:'wide',c:'wide'}}],
  punch:{id:'n3',say:'재밌으면, 그냥, 본다.'}},
 {type:'talk', time:'2:15', tag:'뜻밖의 부작용', cls:'p', rot:3, lines:[
  {w:'a',html:`AI를 믿고<br>${H}글쓰기 수준${E}이 더<br>형편없어지는 느낌…`,say:'AI를 믿고, 글쓰기 수준이 더 형편없어지는 것 같은 느낌.',emo:{a:'sad'}},
  {w:'a',html:'그래서 글쓰기 수업을<br>찾아다니는 중입니다…',say:'그래서 글쓰기 수업을 찾아다니는 중입니다.'},
  {w:'c',html:`글쓰기에 대해 오히려<br>${H}갈망${E} 생기는 것도 맞아요`,say:'글쓰기에 대해 오히려 갈망 생기는 것도 맞아요.',fs:64},
  {w:'b',html:'그래서 점점 사람이<br>잘 쓰는 게<br>중요한 거 같아요',say:'그래서 점점, 사람이 잘 쓰는 게 중요한 거 같아요.'}]},
 {type:'talk', time:'2:23', tag:'글쓰기의 함정', cls:'k', rot:-3, lines:[
  {w:'c',html:`근데 글을 써서<br>서로 읽어보면<br>${H}성격이 다 나와서${E} 부끄러움`,say:'근데 글을 써서 서로 읽어보면, 성격이 다 나와서 부끄러움.',fs:62},
  {w:'a',html:'제 글은 항상<br>팩트 중심',say:'제 글은 항상 팩트 중심.'},
  {w:'c',html:`난 왜 이리..<br>${H}단무지${E}인 걸까..`,say:'난 왜 이리, 단무지인 걸까.',emo:{c:'sad',a:'happy'}}]},
 {type:'rule', narr:[{id:'n4',say:'룰 식스'},{id:'n5',say:'에이아이 쓸수록, 내 글이 고프다.'}]},
 {type:'join'}
];
const CAST={a:{x:40,name:'멤버 A',eyes:'lazy',fill:'#fff',stroke:'#121212'},b:{x:380,name:'멤버 B',eyes:'happy',fill:'#b7f400',stroke:'#121212'},c:{x:720,name:'멤버 C',eyes:'round',fill:'#fff',stroke:'#8a1cf6'}};

/* ---------- mascot (all eye variants inside, toggled per frame) ---------- */
function charSVG(o){
  const w=o.w||320, st=o.stroke||'#121212';
  const eyes={
   lazy:x=>`<ellipse cx="${x}" cy="208" rx="26" ry="21" fill="#fff" stroke="#121212" stroke-width="7"/><path d="M${x-25} 208 A25 20 0 0 1 ${x+25} 208 Z" fill="#e9e4d8" stroke="#121212" stroke-width="6"/><path d="M${x-11} 210 a11 11 0 0 0 22 0 z" fill="#121212"/>`,
   happy:x=>`<path class="ink" stroke-width="9" d="M${x-20} 214 Q${x} 186 ${x+20} 214"/>`,
   round:x=>`<ellipse cx="${x}" cy="208" rx="24" ry="25" fill="#fff" stroke="#121212" stroke-width="7"/><circle cx="${x+3}" cy="211" r="10" fill="#121212"/><circle cx="${x+7}" cy="206" r="3.5" fill="#fff"/>`,
   wide:x=>`<ellipse cx="${x}" cy="206" rx="26" ry="31" fill="#fff" stroke="#121212" stroke-width="7"/><circle cx="${x+1}" cy="208" r="6" fill="#121212"/>`,
   sad:x=>`<path class="ink" stroke-width="9" d="M${x-20} 200 Q${x} 226 ${x+20} 200"/><path d="M${x+(x<220?-24:24)} 226 q10 18 0 26 q-10 -8 0 -26z" fill="#8a1cf6"/>`};
  const eg=Object.keys(eyes).map(k=>`<g class="eye e-${k}" style="display:${k===o.eyes?'':'none'}">${eyes[k](190)}${eyes[k](252)}</g>`).join('');
  let extra='';
  if(o.rec) extra+=`<path class="ink" stroke-width="10" d="M335 250 C380 250 392 210 398 180"/><g transform="rotate(10 410 120)"><rect x="368" y="50" width="88" height="150" rx="18" fill="#121212"/><rect x="380" y="64" width="64" height="112" rx="8" fill="#fff"/><circle cx="412" cy="110" r="20" fill="#f0453a"/><rect x="394" y="146" width="36" height="8" rx="4" fill="#121212"/></g>`;
  return `<svg class="boil" width="${w}" height="${w*460/520}" viewBox="-10 -20 520 460">
    <circle cx="215" cy="235" r="112" fill="${o.fill||'#fff'}"/>
    <path class="ink" style="stroke:${st}" stroke-width="46" d="M282 300 C250 326 180 326 142 292 C112 264 86 262 85 235 A130 130 0 1 1 345 235 A130 130 0 0 1 215 365 A130 130 0 0 1 85 235 L85 30"/>
    ${eg}<ellipse class="mouth" cx="221" cy="254" rx="15" ry="0" fill="#121212"/>
    <path class="ink" style="stroke:${st}" stroke-width="20" d="M170 372 L166 425 L196 428 M262 372 L266 425 L296 428"/>${extra}</svg>`;
}
const castRow=(top,w,tags,d0)=>Object.entries(CAST).map(([k,c],i)=>`<div class="abs ${d0!=null?'up':''}" style="left:${c.x+(320-w)/2}px;top:${top}px;width:${w}px;text-align:center;--d:${(d0||0)+i*.15}s;--y:500px"><div class="wig" style="transform-origin:50% 90%;animation-delay:${-i*.37}s">${charSVG({...c,w})}</div>${tags?`<span class="nm" style="display:inline-block;font-size:36px;border:6px solid ${k==='c'?'#8a1cf6':'#121212'};border-radius:40px;padding:4px 20px 2px;background:${k==='b'?'#b7f400':k==='c'?'#121212':'#fff'};color:${k==='c'?'#fff':'#121212'}">${c.name}</span>`:''}</div>`).join('');


const T_=(x,y,t,sz,c='#121212',f='Bagel Fat One')=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="${f}" font-size="${sz}" fill="${c}">${t}</text>`;

const play_=(c='#121212')=>`<path d="M-24 -52 L36 -18 L-24 16 Z" fill="${c}"/>`;
const K='stroke="#121212" stroke-linecap="round" stroke-linejoin="round"';
const PROPS={

let T=0; const TL=[], MARKS=[]; let lid=0;

  else if(sc.type==='talk'){ let c=T+.6; MARKS.push(['sting',T+.02]);
    sc.lines.forEach(l=>{l.id='l'+(++lid);l.s=c;l.dur=dur(l);l.e=c+l.dur;c=l.e+.16;TL.push({id:l.id,who:l.w,s:l.s,dur:l.dur,say:l.say});MARKS.push([l.big?'boom':'pop',l.s,l.w]);});

  else { sc.e=T+3; MARKS.push(['outro',T]); }
  T=sc.e;
});

    <div class="abs bagel boil2" style="left:60px;top:1190px;font-size:150px;line-height:1.12;letter-spacing:-5px">
      <div class="slam" style="--d:.5s;transform-origin:left center">AI 콘텐츠가</div><div class="slam" style="--d:.8s;transform-origin:left center;color:var(--pur)">범람하는 시대</div></div>

    h+=Object.entries(CAST).map(([k,c])=>`<div class="actor ${k}" data-a="${k}" style="left:${c.x}px">${charSVG(c)}<span class="nm">${c.name}</span></div>`).join('');
    h+=[...new Set(sc.lines.map(l=>PM[l.id]).filter(Boolean))].map(k=>`<div class="prop" data-p="${k}"><div class="pc boil2"></div>${PROPS[k][2]||`<svg class="boil" viewBox="0 0 940 400" width="940" height="400">${PROPS[k][1]}</svg>`}<span class="cap">${PROPS[k][0]}</span></div>`).join('');
    if(sc.punch){ const d=(sc.punchS-sc.s);
      h+=`<div class="abs shake punch" style="inset:0;--d:${d}s;visibility:hidden"><div class="abs" style="inset:0;background:var(--ink)"></div>

      <div class="abs bagel slam boil2" style="left:60px;top:620px;font-size:230px;line-height:1.06;color:#fff;letter-spacing:-5px;--d:${d}s;transform-origin:left center">재밌으면<br><span style="color:var(--lime)">그냥</span><br><span style="color:var(--lime)">본다</span></div>
      <div class="abs fade" style="left:850px;top:1180px;--d:${d+.2}s"><div class="pulse" style="width:110px;height:110px;border-radius:50%;background:transparent"></div></div>
      <div class="abs bagel pop" style="left:66px;top:1440px;font-size:110px;color:var(--pur);--d:${d+.9}s;transform-origin:left center;filter:brightness(1.5)">ㅋㅋㅋㅋㅋㅋㅋ</div></div>`; }

/* ---------- per-frame ---------- */
const seeds=[...document.querySelectorAll('.seed')];
const back=k=>{const c=1.70158;k-=1;return 1+ (c+1)*k*k*k + c*k*k;};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function seek(t){
  SC.forEach(sc=>sc.el.classList.toggle('on', t>=sc.s && t<sc.e));
  document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000;});
  const sd=1+Math.floor(t*8)%6; seeds.forEach(f=>f.setAttribute('seed',sd));
  SC.forEach(sc=>{ if(sc.type!=='talk') return;
    if(t<sc.s||t>=sc.e){ sc.lines.forEach(l=>l.el.style.visibility='hidden'); for(const k in sc.propEls) sc.propEls[k].style.visibility='hidden'; if(sc.punchEl) sc.punchEl.style.visibility='hidden'; return; }
    const L=sc.lines; let cur=-1; L.forEach((l,i)=>{ if(t>=l.s) cur=i; });
    const inPunch=sc.punchS!=null && t>=sc.punchS;
    if(sc.punchEl) sc.punchEl.style.visibility=inPunch?'visible':'hidden';
    L.forEach((l,i)=>{ const e=l.el;
      if(i!==cur||inPunch){e.style.visibility='hidden';return;}
      e.style.visibility='visible';
      const bx='';
      if(i===cur){ const k=cl((t-l.s)/.28); e.classList.remove('prev'); e.style.opacity=1; e.style.transform=`${bx}scale(${.4+.6*back(k)})`; }
      else { const c=L[cur], k=cl((t-c.s)/.25), h=c.el.offsetHeight+60; e.classList.add('prev');
        if(i===cur-1){ e.style.opacity=1-.6*k; e.style.transform=`${bx}translateY(${-h*k}px) scale(${1-.14*k})`; }
        else { const h1=L[cur-1].el.offsetHeight+60; e.style.opacity=.4*(1-cl(k*2)); e.style.transform=`${bx}translateY(${-(h1+h*k)}px) scale(.86)`; } }
    });
    let pk=null,ps=sc.s+.2; L.forEach((x,i)=>{const k=PM[x.id]; if(k&&(i<=cur||pk===null)&&k!==pk){pk=k; ps=(i<=cur&&i>0)?x.s:sc.s+.2;}});
    for(const k in sc.propEls){const p=sc.propEls[k], on=k===pk&&!inPunch; p.style.visibility=on?'visible':'hidden'; if(on) p.style.transform=`rotate(-1.5deg) scale(${.5+.5*back(cl((t-ps)/.3))})`;}
    const l=cur>=0?L[cur]:null;
    for(const k in sc.actors){ const a=sc.actors[k], c=CAST[k];
      const sp=l&&l.w===k&&t<l.e+.1, tau=l?t-l.s:0;
      const wgt=sp?cl(tau/.15)*cl((l.e+.1-t)/.12):0;
      const env=sp?(V.env[l.id]?(V.env[l.id][Math.round(tau*30)]||0):Math.abs(Math.sin(tau*17))*(.55+.45*Math.sin(tau*5.3+1))):0;
      a.style.transform=`translateY(${-18*wgt-10*wgt*Math.abs(Math.sin(tau*9))}px) scale(${.92+.2*wgt})`;
      a.querySelector('.mouth').setAttribute('ry', sp?(2+11*cl(env)).toFixed(1):0);
      const emo=(l&&l.emo&&l.emo[k])||c.eyes;
      a.querySelectorAll('.eye').forEach(g=>g.style.display=g.classList.contains('e-'+emo)?'':'none');
    }
  });
}
window.seek=seek;
if(!location.search.includes('render')){
  const k=Math.min(innerHeight/1920, innerWidth/1080); stage.style.transformOrigin='0 0'; stage.style.transform=`scale(${k})`;
  const t0=performance.now(); (function loop(){seek(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();
}
